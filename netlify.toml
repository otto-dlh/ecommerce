[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "pnpm run dev:web"
  targetPort = 5173
  port = 8888

# SPA: cualquier ruta del frontend sirve index.html (las rutas /api/* y /sandbox/* las atienden las funciones)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad para todo el sitio (hardening del frontend, T07 / T13 / ASVS v5.0.0-12.1.1).
# La Content-Security-Policy se genera en dist/_headers al compilar (ver tooling/vite/csp.mjs).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
