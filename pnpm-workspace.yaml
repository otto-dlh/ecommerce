# Politica de cadena de suministro (T06 / ASVS v5.0.0-15.1.x)
# - No instalar versiones publicadas hace menos de 24 h (mitiga paquetes comprometidos recien publicados)
# - No ejecutar scripts de instalacion de dependencias salvo que se aprueben explicitamente
minimumReleaseAge: 1440
strictDepBuilds: true
onlyBuiltDependencies: []
# Arbol de dependencias aislado (sin dependencias fantasma). Las funciones se empaquetan con
# esbuild, que incluye @insforge/sdk y sus dependencias dentro del zip de cada funcion.
